name: Pages Workflow
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: gh-pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.release.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Inject
        env:
          A5806A: ${{ secrets.A5806A }}
          B86A71: ${{ secrets.B86A71 }}
        run: |
          python3 -c "
          import os, pathlib, sys
          k1 = os.environ.get('A5806A', '')
          k2 = os.environ.get('B86A71', '')
          idx = pathlib.Path('index.html')
          txt = idx.read_text(encoding='utf-8')
          out = txt.replace('<!-- cbbcc5ef4c95495df69a1f -->', k1) if k1 else txt
          out = out.replace('<!-- 605b1379659bd94713cceca84a10d0c0 -->', k2) if k2 else out
          if out == txt and (k1 or k2):
              sys.exit(1)
          if out != txt:
              idx.write_text(out, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: release
        uses: actions/deploy-pages@v4
